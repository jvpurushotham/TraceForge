# ============================================================================
# PHASE 2 - observability: OpenTelemetry Collector, Tempo (traces), Loki (logs),
#           Prometheus (metrics + alert rules), Alertmanager, Grafana (4 dashboards).
# Layer on top of Phase 1:
#   docker compose -f docker-compose.yml -f docker-compose.phase2.yml up --build -d
# Alerts are visible in Alertmanager (http://localhost:9093); Phase 3 adds the webhook receiver.
# ============================================================================
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  product-service:
    environment: *otel
    depends_on: {otel-collector: {condition: service_started}}
  inventory-service:
    environment: *otel
    depends_on: {otel-collector: {condition: service_started}}
  payment-service:
    environment: *otel
    depends_on: {otel-collector: {condition: service_started}}
  order-service:
    environment: *otel
    depends_on: {otel-collector: {condition: service_started}}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [tempo, loki]
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]
    restart: unless-stopped
  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports: ["3100:3100"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ./observability/prometheus/prometheus.phase2.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./observability/alertmanager/alertmanager.phase2.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]
    restart: unless-stopped

volumes:
  tempo-data:
  loki-data:
  prom-data:
