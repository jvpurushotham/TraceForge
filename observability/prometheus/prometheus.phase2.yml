# Phase-2 variant: no incident-service target yet.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: traceforge
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:8000"]
        labels: {service: order-service}
      - targets: ["product-service:8001"]
        labels: {service: product-service}
      - targets: ["inventory-service:8002"]
        labels: {service: inventory-service}
      - targets: ["payment-service:8003"]
        labels: {service: payment-service}

  # meta-monitoring: watch the monitoring stack itself
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"]}]
  - job_name: loki
    static_configs: [{targets: ["loki:3100"]}]
