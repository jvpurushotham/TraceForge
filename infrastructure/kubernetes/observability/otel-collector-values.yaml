# helm upgrade --install otel-collector open-telemetry/opentelemetry-collector -n traceforge-observability -f this-file
mode: deployment
image: {repository: otel/opentelemetry-collector-contrib}
command: {name: otelcol-contrib}
ports:
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
config:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: 0.0.0.0:4317}
        http: {endpoint: 0.0.0.0:4318}
    jaeger: null
    prometheus: null
    zipkin: null
  processors:
    batch: {timeout: 1s}
  exporters:
    otlp/tempo: {endpoint: "tempo:4317", tls: {insecure: true}}
    otlphttp/loki: {endpoint: "http://loki:3100/otlp"}
  service:
    pipelines:
      traces: {receivers: [otlp], processors: [batch], exporters: [otlp/tempo]}
      logs: {receivers: [otlp], processors: [batch], exporters: [otlphttp/loki]}
      metrics: null
