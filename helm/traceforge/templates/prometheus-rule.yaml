{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: traceforge-alerts
  labels: {release: {{ .Values.prometheusRule.releaseLabel }}}
spec:
  groups:
  - name: traceforge-slo
    rules:
    - alert: HighErrorRate
      expr: ( sum by (service) (rate(http_requests_total{status=~"5.."}[30s])) / sum by (service) (rate(http_requests_total[30s])) ) > 0.10 and sum by (service) (rate(http_requests_total[30s])) > 0.2
      for: 10s
      labels:
        severity: high
      annotations:
        summary: '{{`{{ $labels.service }}`}}: more than 10% of requests are failing'
        symptom: Elevated error rate
    - alert: HighLatencyP95
      expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[30s]))) > 1.5 and sum by (service) (rate(http_requests_total[30s])) > 0.2
      for: 10s
      labels:
        severity: high
      annotations:
        summary: '{{`{{ $labels.service }}`}}: p95 latency above 1.5s'
        symptom: Elevated latency
    - alert: ServiceDown
      expr: up{job="traceforge"} == 0
      for: 10s
      labels:
        severity: critical
      annotations:
        summary: '{{`{{ $labels.service }}`}} is not being scraped / is unreachable'
        symptom: Service unavailable
    - alert: ServiceRestarting
      expr: changes(process_start_time_seconds{job="traceforge"}[2m]) > 0
      for: 0s
      labels:
        severity: high
      annotations:
        summary: '{{`{{ $labels.service }}`}} restarted in the last 2 minutes'
        symptom: Workload instability (restarts)
    - alert: HighMemoryUsage
      expr: process_resident_memory_bytes{job="traceforge"} > 400 * 1024 * 1024
      for: 30s
      labels:
        severity: medium
      annotations:
        summary: '{{`{{ $labels.service }}`}} uses more than 400 MiB'
        symptom: Resource pressure (memory)
  - name: traceforge-meta-monitoring
    rules:
    - alert: TelemetryPipelineDown
      expr: up{job=~"otel-collector|tempo|loki"} == 0
      for: 30s
      labels:
        severity: high
        service: observability-stack
      annotations:
        summary: A telemetry backend is down - missing data must NOT be read as healthy
        symptom: Telemetry pipeline degraded
{{- end }}
