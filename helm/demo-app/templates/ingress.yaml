{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - {path: /orders, pathType: Prefix, backend: {service: {name: order-service, port: {number: 8000}}}}
          - {path: /products, pathType: Prefix, backend: {service: {name: product-service, port: {number: 8001}}}}
{{- end }}
